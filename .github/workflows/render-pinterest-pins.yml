name: Render Pinterest Pins

on:
  push:
    paths:
      - "pin_specs/*.json"
      - "scripts/render_pin.py"
      - ".github/workflows/render-pinterest-pins.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-pinterest-pins
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer dependency
        run: python -m pip install --upgrade pip pillow

      - name: Render pin assets
        run: python scripts/render_pin.py pin_specs/*.json

      - name: Commit rendered assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pins/*.jpg
          if git diff --cached --quiet; then
            echo "No rendered changes."
            exit 0
          fi
          git commit -m "Render Pinterest pin assets"
          git push
