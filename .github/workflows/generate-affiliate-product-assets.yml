name: Generate Affiliate Product Assets

on:
  push:
    paths:
      - 'product_specs/*.json'
      - 'templates/product-landing.html'
      - 'scripts/generate_product_page.py'
      - 'scripts/generate_distribution_assets.py'
      - 'scripts/render_short.py'
      - 'scripts/render_pin.py'
      - 'scripts/update_sitemap.py'
      - '.github/workflows/generate-affiliate-product-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-affiliate-product-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate product pages and pin specs
        run: python3 scripts/generate_product_page.py product_specs/*.json

      - name: Generate SEO and short-form specs
        run: python3 scripts/generate_distribution_assets.py product_specs/*.json

      - name: Update sitemap
        run: python3 scripts/update_sitemap.py

      - name: Install media dependencies
        run: |
          python3 -m pip install --upgrade pip pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Render Pinterest assets
        run: python3 scripts/render_pin.py pin_specs/*.json

      - name: Render short-form video assets
        run: python3 scripts/render_short.py short_specs/*.json

      - name: Validate affiliate assets
        run: python3 scripts/validate_affiliate_pages.py

      - name: Commit generated product assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/*.html pin_specs/*.json assets/pins/*.jpg distribution/*.json short_specs/*.json assets/shorts/*.mp4 sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Generate affiliate distribution assets"
          git pull --rebase origin main
          git push
